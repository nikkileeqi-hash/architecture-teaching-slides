<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一点透视 · 设计表达基础</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#193c37;background:#e8e6dd}*{box-sizing:border-box}body{margin:0}main{height:100dvh;display:flex;flex-direction:column;padding:3vh 4vw}header{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#63746d}article{flex:1;min-height:0;display:grid;grid-template-columns:36% 64%;align-items:center;gap:1vw}h1{font-size:clamp(28px,4.3vw,66px);line-height:1.18;font-weight:600;margin:14px 0 24px;letter-spacing:-2px}h2{font-size:16px;color:#b45434;font-weight:500;letter-spacing:3px}p,li{font-size:clamp(15px,1.45vw,23px);line-height:1.8}ul{padding-left:1.2em}figure{margin:0;background:#f8f6ef;border:1px solid #cbcfc3;border-radius:4px;padding:1vw}svg{display:block;width:100%;max-height:62vh;touch-action:none}figcaption{font-size:13px;color:#697970;padding:8px}footer{display:flex;align-items:center;gap:12px;padding-top:15px}button,select{font:inherit;background:transparent;border:1px solid #a9b8ac;color:#193c37;border-radius:4px;padding:9px 13px;cursor:pointer}button:hover{background:#d5ded1}button:disabled{opacity:.3;cursor:default}#count{margin-left:auto;font-variant-numeric:tabular-nums}#progress{height:3px;background:#bec9ba}#bar{height:100%;background:#b45434;transition:width .2s}a{color:inherit}#step{background:#193c37;color:white}svg text{font-size:18px;fill:#193c37}svg .guide{stroke:#b45434;stroke-width:1.5;stroke-dasharray:7 6}svg .edge{stroke:#234c42;stroke-width:3;fill:none}svg .hl{stroke:#b45434;stroke-width:2}svg .thin{stroke:#81998b;stroke-width:1.4;fill:none}.tag{font-size:12px;letter-spacing:2px;color:#78867c}body:fullscreen{background:#e8e6dd}@media(max-width:700px){main{height:auto;min-height:100dvh;padding:20px}article{grid-template-columns:1fr;gap:8px}h1{font-size:34px;margin:10px 0}p,li{font-size:16px}svg{max-height:43vh}footer{flex-wrap:wrap}select{max-width:160px}header{letter-spacing:0}figure{padding:5px}}@media print{main{height:auto}header,footer,#progress{display:none}article{break-after:page;min-height:90vh}figure{border:0}}
</style></head><body><main><header><a href="../../">设计表达基础 / 空间表达</a><span>ARCHITECTURAL DRAWING · 01</span></header><article><section><div class="tag" id="tag"></div><h1 id="title"></h1><div id="copy"></div></section><figure><svg id="drawing" viewBox="0 0 800 560" role="img" aria-label="一点透视作图示意"></svg><figcaption id="caption"></figcaption></figure></article><footer><button id="prev" aria-label="上一页">←</button><button id="next" aria-label="下一页">→</button><select id="menu" aria-label="选择幻灯片"></select><button id="step" hidden>下一步作图</button><button id="full">全屏</button><span id="count" aria-live="polite"></span></footer></main><div id="progress"><div id="bar"></div></div><script>
const slides=[
['看见空间的深度','一点透视','<p>从一个矩形开始，画出一个有深度的空间。</p><p>观察 → 理解 → 作图 → 检查</p>','room','建筑空间表达 / 入门演示'],
['01 / 基本原理','为什么是「一点」？','<p>当一个主要方向垂直于画面时，这组平行线在图上汇聚于同一灭点。</p><ul><li>正对我们的面：保持水平与竖直</li><li>伸向深处的边：指向灭点 VP</li></ul>','box','本例采用画面竖直、视线水平的标准一点透视。'],
['02 / 三个要素','视平线 · 灭点 · 正面','<ul><li>HL 视平线：眼睛高度对应的水平线</li><li>VP 灭点：本例中进深方向的消失位置</li><li>正面：与画面平行的矩形</li></ul><p>灭点在视平线上，不一定在画面中心。</p>','labels','红色表示辅助线，绿色表示形体轮廓。'],
['03 / 分步作图','把矩形变成立方体','<p>点击「下一步作图」，观察四个步骤。</p><ol><li>定视平线与灭点</li><li>画正面矩形</li><li>四角连向灭点</li><li>选深度，封闭后面</li></ol>','steps','这里只表达长方体；若要精确作正方体，还需要量深方法。'],
['04 / 深度控制','越远，投影越小','<p>后面的四个角，都必须落在前面四角通向灭点的射线上。</p><p>后面矩形越靠近灭点，所表达的进深越长。</p><p>仅凭任意取点，不能确定真实进深尺寸。</p>','depth','相同正面、不同进深：示意投影关系，不是尺寸测量。'],
['05 / 室内应用','站在房间正前方','<p>后墙是矩形。地面、天花与侧墙的交界线，都朝灭点汇聚。</p><p>沿进深方向的地砖分格，在图上越远越密。</p>','room','地砖按等距空间分格进行透视投影。'],
['06 / 动手观察','移动你的视线','<p>拖动红色灭点，或使用下方方向按钮。</p><p>左右移动：改变构图中的对准位置。<br>上下移动：同时改变视平线高度。</p><p>观察地面与天花在画面中的占比。</p><div><button onclick="move(-30,0)">←</button> <button onclick="move(0,-25)">↑</button> <button onclick="move(0,25)">↓</button> <button onclick="move(30,0)">→</button> <button onclick="resetVP()">复位</button></div>','interactive','教学示意：移动灭点时，保持后墙矩形并重构房间。'],
['07 / 常见错误','不是所有线都斜着画','<ul><li>进深边各自指向不同位置 → 空间扭曲</li><li>正面水平边随意倾斜 → 正面变形</li><li>地砖分格等距 → 缺少远近压缩</li></ul><p>检查方法：延长进深边，看它们是否交于同一灭点。</p>','wrong','右侧红色错线没有通过 VP；绿色线为正确方向。'],
['08 / 课堂练习','画一个小型展厅','<p>用 5 分钟完成：</p><ol><li>定眼高，选灭点</li><li>画后墙与四条空间边界</li><li>加地面分格和一幅墙上画</li><li>用辅助线检查进深方向</li></ol><p>思考：怎样让画面显得更开阔？</p>','exercise','先画结构，再加细节；细节也要遵守同一套透视关系。'],
['09 / 回顾','一条线，一个点，一套规则','<p><strong>视平线确定眼高。<br>灭点组织进深。<br>水平与竖直保持秩序。</strong></p><p>下一步：比较一点透视与两点透视。</p>','room','检查：进深边汇聚 / 正面不变形 / 远处更紧凑。']];
const $=id=>document.getElementById(id),svg=$('drawing');let page=0,stage=0,vx=400,vy=240,drag=false;
const line=(x,y,a,b,c='edge')=>`<line class="${c}" x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`;
const rect=(x,y,w,h,c='edge')=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const label=(x,y,t)=>`<text x="${x}" y="${y}">${t}</text>`;
function horizon(x=400,y=240){return line(25,y,775,y,'hl')+`<circle cx="${x}" cy="${y}" r="7" fill="#b45434"/>`+label(x+12,y-14,'VP')+label(28,y-12,'HL')}
function box(step=4,t=.48){let s=horizon(),a=[[130,300],[330,300],[330,480],[130,480]],b=a.map(([x,y])=>[400+(x-400)*t,240+(y-240)*t]);if(step>=2)s+=rect(130,300,200,180);if(step>=3)a.forEach(([x,y])=>s+=line(x,y,400,240,'guide'));if(step>=4){s+=rect(b[0][0],b[0][1],200*t,180*t);a.forEach(([x,y],i)=>s+=line(x,y,...b[i]));}return s}
function room(x=400,y=240,detail=true){let s='',corners=[[50,50],[750,50],[750,510],[50,510]],k=.32,back=corners.map(([a,b])=>[x+(a-x)*k,y+(b-y)*k]);s+=`<polygon points="50,510 750,510 ${back[2]} ${back[3]}" fill="#dfe6d6"/>`;s+=rect(50,50,700,460);s+=rect(back[0][0],back[0][1],700*k,460*k);corners.forEach(([a,b],i)=>s+=line(a,b,...back[i]));if(detail){for(let z of [1,2,3,4,5,6]){let t=1/(1+z*.35);s+=line(x+(50-x)*t,y+(510-y)*t,x+(750-x)*t,y+(510-y)*t,'thin')}for(let a of [190,330,470,610])s+=line(a,510,x+(a-x)*k,y+(510-y)*k,'thin');}return s+horizon(x,y)}
function draw(){let kind=slides[page][3],s='';if(kind==='steps')s=box(stage+1);else if(kind==='box'||kind==='labels')s=box();else if(kind==='depth'){s=box(4,.65)+rect(400+(130-400)*.25,240+(300-240)*.25,50,45,'thin')+label(470,380,'同一组射线，选择不同深度');}else if(kind==='wrong'){s=box()+line(130,300,520,190,'hl')+label(480,175,'× 没有指向 VP');}else{s=room(kind==='interactive'?vx:400,kind==='interactive'?vy:240,kind!=='exercise');if(kind==='exercise')s+=rect(328,213,105,67,'thin')+label(300,460,'补充地面分格与陈设');}svg.innerHTML=s;}
function render(){let s=slides[page];$('tag').textContent=s[0];$('title').textContent=s[1];$('copy').innerHTML=s[2];$('caption').textContent=s[4];$('count').textContent=`${String(page+1).padStart(2,'0')} / ${slides.length}`;$('bar').style.width=((page+1)/slides.length*100)+'%';$('menu').value=page;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('step').hidden=s[3]!=='steps';$('step').textContent=stage===3?'重新演示':'下一步作图 · '+(stage+1)+'/4';location.replace('#'+(page+1));draw();}
function go(n){page=Math.max(0,Math.min(slides.length-1,n));stage=0;render()}
function move(x,y){vx=Math.max(180,Math.min(620,vx+x));vy=Math.max(120,Math.min(400,vy+y));draw()}
function resetVP(){vx=400;vy=240;draw()}
slides.forEach((s,i)=>$('menu').add(new Option((i+1)+'. '+s[1],i)));$('menu').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('step').onclick=()=>{stage=(stage+1)%4;render()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{ $('caption').textContent='当前浏览器不支持全屏，可使用浏览器的全屏功能。'}};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(page+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(page-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')$('full').click()});
function pointer(e){let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());vx=Math.max(180,Math.min(620,p.x));vy=Math.max(120,Math.min(400,p.y));draw()}
svg.onpointerdown=e=>{if(slides[page][3]!=='interactive')return;drag=true;svg.setPointerCapture(e.pointerId);pointer(e)};svg.onpointermove=e=>{if(drag)pointer(e)};svg.onpointerup=svg.onpointercancel=()=>drag=false;window.onhashchange=()=>{let n=Number(location.hash.slice(1))-1;if(Number.isInteger(n)&&n>=0&&n<slides.length&&n!==page)go(n)};let initial=Number(location.hash.slice(1))-1;go(Number.isInteger(initial)&&initial>=0&&initial<slides.length?initial:0);
</script></body></html>
